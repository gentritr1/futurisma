<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Dream Island polish evidence</title><style>body{background:#111922;color:#e9f0f4;font:16px system-ui;max-width:1400px;margin:32px auto;padding:0 20px}h1{font-size:26px}img{max-width:100%;display:block}input{width:min(700px,80%)}button{padding:8px 20px;margin-right:16px}a{color:#83dbe1}section{margin:36px 0}small{color:#bbc8d1}</style><h1>Dream Island — polish review</h1><p><a href="README.md">Measured report</a> · <a href="crossfade-baseline/ten-means.md">Ten means, before / after / repeat</a></p><section><h2>The strike</h2><p>Ten actual rendered frames across the shipped twelve-second ramp.</p><img id="strike" alt="Dream Island strike frame"><p><button id="play">Play</button><input id="frame" type="range" min="0" max="9" value="0" step="1"></p><small id="caption"></small></section><section><h2>Before and after</h2><img src="eyeball-before-after.png" alt="Phase C and polish at the same seventeen source slots"></section><section><h2>Palette</h2><img src="palette/palette-swatches.png" alt="Eight dominant colours per reference and game state"></section><section><h2>Horizon profiles</h2><img src="horizon-profiles.png" alt="Four day frames with their row-luma profiles"></section><script>const frames=[{"src": "strike/00.png", "label": "0.000 s after strike \u00b7 blend 0.0000 \u00b7 tick 8014"}, {"src": "strike/01.png", "label": "1.367 s after strike \u00b7 blend 0.0360 \u00b7 tick 8178"}, {"src": "strike/02.png", "label": "2.675 s after strike \u00b7 blend 0.1269 \u00b7 tick 8335"}, {"src": "strike/03.png", "label": "4.000 s after strike \u00b7 blend 0.2593 \u00b7 tick 8494"}, {"src": "strike/04.png", "label": "5.342 s after strike \u00b7 blend 0.4180 \u00b7 tick 8655"}, {"src": "strike/05.png", "label": "6.683 s after strike \u00b7 blend 0.5850 \u00b7 tick 8816"}, {"src": "strike/06.png", "label": "8.033 s after strike \u00b7 blend 0.7444 \u00b7 tick 8978"}, {"src": "strike/07.png", "label": "9.342 s after strike \u00b7 blend 0.8745 \u00b7 tick 9135"}, {"src": "strike/08.png", "label": "10.692 s after strike \u00b7 blend 0.9669 \u00b7 tick 9297"}, {"src": "strike/09.png", "label": "12.000 s after strike \u00b7 blend 1.0000 \u00b7 tick 9454"}];let timer;const slider=document.querySelector('#frame'),image=document.querySelector('#strike'),caption=document.querySelector('#caption'),button=document.querySelector('#play');function show(){const f=frames[Number(slider.value)];image.src=f.src;caption.textContent=f.label}slider.oninput=()=>{clearInterval(timer);button.textContent='Play';show()};button.onclick=()=>{if(button.textContent==='Pause'){clearInterval(timer);button.textContent='Play';return}slider.value=0;show();button.textContent='Pause';timer=setInterval(()=>{slider.value=Number(slider.value)+1;show();if(Number(slider.value)===9){clearInterval(timer);button.textContent='Play'}},12000/9)};show();</script>
