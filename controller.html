<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#06090b" />
    <!-- same-origin, not no-referrer: under no-referrer some WebKit builds send
         `Origin: null` on the pad POST, which the relay must refuse. -->
    <meta name="referrer" content="same-origin" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="icon" href="data:," />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; worker-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <link rel="stylesheet" href="/src/phone/controller.css" />
    <title>FUTURISMA · Phone controller</title>
  </head>
  <body>
    <!-- Dev-only phone controller (npm run dev:phone). Not part of the production build. -->
    <div class="stage" id="stage">
    <main class="pad pad--tilt" id="pad">
      <header class="pad__bar">
        <div class="pad__group">
          <button type="button" data-tap="st">START</button>
          <button type="button" data-tap="r">RESET</button>
        </div>
        <p class="pad__status" id="status" role="status">
          <span class="pad__status-dot" aria-hidden="true"></span><span id="status-text">connecting…</span>
        </p>
        <div class="pad__group">
          <button type="button" id="center">CENTER</button>
          <button type="button" id="preset" aria-label="Steering sensitivity">MED</button>
          <button type="button" id="mode">TILT</button>
          <button type="button" id="invert" aria-label="Invert tilt">⇄</button>
        </div>
      </header>
      <section class="pad__left">
        <button type="button" class="pad__big pad__brake" data-hold="b"><span>BRAKE</span></button>
        <div class="pad__wheel" id="wheel">DRAG TO STEER</div>
      </section>
      <section class="pad__mid">
        <div class="pad__gauge" aria-hidden="true">
          <svg class="pad__gauge-svg" viewBox="0 0 120 70">
            <path d="M12 62 A48 48 0 0 1 108 62" fill="none" stroke="rgba(223,247,238,0.14)" stroke-width="8" stroke-linecap="round"/>
            <path d="M60 14 L60 22" stroke="rgba(223,247,238,0.4)" stroke-width="2"/>
            <g class="pad__needle" id="gauge-needle">
              <path d="M60 62 L60 20" stroke="#c0f000" stroke-width="4" stroke-linecap="round"/>
            </g>
            <circle cx="60" cy="62" r="5" fill="#c0f000"/>
          </svg>
          <p class="pad__gauge-value" id="gauge-value">0</p>
          <p class="pad__gauge-note" id="gauge-note">turn like a wheel</p>
        </div>
        <!-- Shown only when the game reports the circuit has them (gravity decks / powers). -->
        <div class="pad__actions" id="actions" hidden>
          <button type="button" data-tap="f" id="flip" hidden>FLIP</button>
          <button type="button" data-tap="p" id="power" hidden>POWER</button>
        </div>
        <button type="button" class="pad__brake-small" data-hold="b">BRAKE</button>
      </section>
      <section class="pad__right">
        <button type="button" class="pad__boost" data-hold="x"><span>BOOST</span><small>+ GAS</small></button>
        <button type="button" class="pad__big pad__gas" data-hold="g"><span>GAS</span></button>
      </section>
    </main>
    <div class="intro" id="intro">
      <h1>FUTURISMA</h1>
      <p>Hold the phone sideways like a steering wheel.</p>
      <button type="button" id="go">TAP TO START</button>
      <p class="intro__note" id="intro-note"></p>
    </div>
    <div class="hold-hint" id="hold-hint" hidden>Hold the phone sideways</div>
    </div>
    <script type="module" src="/src/phone/controller.ts"></script>
  </body>
</html>
